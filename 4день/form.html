<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анкета моего крутого сайта</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <div class="logo">
            <img class="logo_img" src="./img/ec85f863c547aa9d871afb5c4013b9.jpg" alt="БабаКлава">
            <h1>БабаКлава</h1>
        </div>

        <nav class="top-nav">
            <a href="cart.html" class="nav-btn about">Анкета</a>
            <a href="index.html" class="nav-btn about">Главная</a>
            <a href="gallery.html" class="nav-btn shop">Магазин</a>
            <a href="form.html" class="nav-btn cart-btn">Корзина <span id="cart-count">0</span></a>
        </nav>
    </header>

    <main>
        <section class="section">
            <h2>Твоя корзина</h2>

            <div id="cart-items"></div>

            <div id="cart-empty" class="cart-empty" style="display: none;">
                <p>Корзина пустая...</p>
                <p class="highlight">БабаКлава говорит: «А ты пельмени-то хотел?»</p>
                <br>
                <a href="index.html" class="nav-btn shop">Вернуться в магазин</a>
            </div>

            <div id="cart-summary" style="display: none; margin-top: 40px; text-align: center;">
                <h3>Итого: <span id="cart-total">0</span> ₽</h3>
                <button class="donate-btn" id="checkout-btn" style="margin-top: 20px;">Оформить заказ</button>
                <br><br>
                <button class="clear-cart-btn" id="clear-cart">Очистить корзину</button>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2025 БабаКлава. Все права защищены (и борщ тоже)</p>
    </footer>

    <script src="./java.js"></script>
</body>
</html>
